name: Build Epic Duck 3DS

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup env
        run: |
          echo "DEVKITPRO=/opt/devkitpro" >> $GITHUB_ENV
          echo "DEVKITARM=/opt/devkitpro/devkitARM" >> $GITHUB_ENV
          echo "/opt/devkitpro/devkitARM/bin" >> $GITHUB_PATH
          # container uses sh, not bash
          if [ -f /etc/profile.d/devkit-env.sh ]; then
            . /etc/profile.d/devkit-env.sh
          fi
          echo "DEVKITPRO is $DEVKITPRO"
          ls /opt/devkitpro/libctru/include/3ds.h || echo "WARNING: 3ds.h not found at expected path"

      - name: Install makerom
        run: |
          apt-get update -qq && apt-get install -y -qq wget unzip > /dev/null 2>&1 || true
          for url in \
            "https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18.3/makerom-v0.18.3-ubuntu_x86_64.zip" \
            "https://github.com/3DSGuy/Project_CTR/releases/download/v0.18.4/makerom_0_18_4_linux_x86_64.zip"; do
            wget -q "$url" -O /tmp/makerom.zip && break || true
          done
          if [ -f /tmp/makerom.zip ]; then
            unzip -o /tmp/makerom.zip -d /tmp/
            find /tmp -name "makerom*" -type f -executable -exec cp {} /usr/local/bin/makerom \; || true
            chmod +x /usr/local/bin/makerom || true
          fi
          which makerom || echo "makerom not available"

      - name: Build
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitARM
          export PATH=$DEVKITARM/bin:$PATH
          make clean || true
          make

      - name: Show results
        run: |
          ls -la *.elf *.3dsx *.cia *.smdh 2>/dev/null || ls -la

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EpicDuck-3DS
          path: |
            EpicDuck.3dsx
            EpicDuck.cia
            EpicDuck.elf
            EpicDuck.smdh
          if-no-files-found: warn
